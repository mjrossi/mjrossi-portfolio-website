version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Astro moves in lockstep (astro + its integrations share peer ranges);
      # splitting them across PRs makes every PR fail ERESOLVE.
      #
      # `wrangler` belongs here too, even though it isn't an Astro package.
      # @astrojs/cloudflare pulls @cloudflare/vite-plugin, which depends on an
      # EXACT wrangler; when root wrangler drifts off that version npm stops
      # deduping the two and installs a second, nested wrangler with its own
      # workerd/miniflare (see the note below the groups for what that costs).
      # A solo wrangler PR is exactly how they drift apart, so keep them in one
      # PR where CI builds the combination.
      #
      # This group deliberately has NO `update-types`, and that is the whole
      # point of it. It used to say `major`, on the reasoning that minor/patch
      # needed no rule because the pattern-less `npm-minor-patch` group already
      # swept astro and wrangler into one PR. That holds only while every
      # astro-family package moves by the SAME bump type. It doesn't take much
      # for them not to: @astrojs/mdx 7→8 (major) and astro 7.2→7.3 (minor)
      # opened as two PRs, and NEITHER was mergeable on its own —
      #
      #   - astro 7.3 dropped the `beginContentEntryCollection` export that
      #     @astrojs/cloudflare 14.2.x imports, so the minor/patch PR failed to
      #     build until the adapter went to 14.3.x, which that PR didn't touch
      #     because `"@astrojs/cloudflare": "14"` was already satisfied;
      #   - @astrojs/mdx 8 delegates .mdx compilation to the markdown processor
      #     and peer-depends on @astrojs/markdown-remark ^7.3.0.
      #
      # Constraining the group by update type sorts packages by how far they
      # happened to move rather than by what has to be installed together, which
      # is the opposite of what a group is for. Everything else still falls
      # through to `npm-minor-patch`, which is pattern-less and matches last.
      astro-cloudflare:
        patterns:
          - astro
          - "@astrojs/*"
          - wrangler
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # The wrangler >=4.111.0 hold is gone: it existed because wrangler 4.111.0
    # removed the `legacy_env` config field while @cloudflare/vite-plugin (via
    # @astrojs/cloudflare) still injected `legacy_env: true` into the generated
    # dist/server/wrangler.json. @cloudflare/vite-plugin 1.48.0 stopped emitting
    # it and now strips a stray one with a warning instead of hard-erroring, so
    # wrangler 4.115.0 + @astrojs/cloudflare 14.1.6 run clean.
    #
    # Before re-pinning wrangler for any future incompatibility, know what the
    # last pin cost: holding root wrangler off the version @cloudflare/vite-plugin
    # depends on stops npm deduping them, so a SECOND wrangler gets installed
    # nested under the plugin. That means two workerd/miniflare builds, and both
    # default their local persistence root to `.wrangler/state/v3` — the build's
    # prerenderer and `wrangler dev` then take turns handing the same
    # metadata.sqlite to a workerd that didn't write it. Symptom: whichever of
    # `npm run build` / `wrangler dev` runs second dies with a SQLite error, in
    # either order, every time, until `.wrangler` is deleted by hand.
    #
    # If a pin is ever unavoidable, either match the version the plugin depends
    # on, or set `persistState: false` on the adapter in astro.config.mjs so the
    # build writes no local state at all (nothing here needs it — there are no
    # stateful bindings, and the auto-provisioned SESSION KV store is unused).
    ignore:
      # js-yaml is Astro's parser before it is ours, and the whole point of the
      # direct dependency is that scripts/content.mjs and src/lib/pubdate.test.js
      # read frontmatter through the SAME library the build does. astro (through
      # 7.2.2) depends on `js-yaml: ^4.3.0`, so a major here does not upgrade the
      # build — it forks it. npm stops deduping, nests astro's own 4.x, and leaves
      # our scripts alone on 5.x.
      #
      # That fork is not academic. js-yaml 5 splits `timestampTag` out of its
      # default schema, so an unquoted `pubDate: 2026-05-10T14:00:00` comes back a
      # STRING rather than a Date — which coercePubDate then refuses with "remove
      # the quotes" on a line carrying none, while astro's nested 4.x still reads
      # the same literal as a Date. `YAML11_SCHEMA` puts timestamps back but turns
      # `yes` into true, `012` into 10 and `1:30` into 90, so there is no v5 schema
      # that reproduces v4's default. Either way the minting scripts and the build
      # disagree about when a post publishes, which is the one thing this
      # dependency is declared to prevent. PR #74 failed exactly this way.
      #
      # Lift this when astro's own dependency moves to js-yaml 5, and move the pin
      # in package.json onto its new range in the same commit.
      - dependency-name: js-yaml
        update-types:
          - version-update:semver-major

      # typescript is here for mdx-analyzer, not for the build — nothing in this
      # repo runs tsc, and docs/FILE-MAP.md has the full rationale. Every
      # Volar-based language server (MDX, Astro, Vue, Svelte) embeds TypeScript's
      # JavaScript Language Service API, and TypeScript 7 is the Go port: its
      # lib/ holds native binaries and a tsc.js shim, with no typescript.js and
      # no tsserverlibrary.js. Volar's loadTsdkByPath throws on that during
      # initialize, so the server refuses to start and .mdx posts open on an RPC
      # error instead of a language server. The TypeScript team's own position is
      # that embedders "can only currently rely on TypeScript 6.0" until a
      # replacement API ships; astro still devDepends on ^6.0.3 for this reason.
      #
      # PR #88 already made this exact bump and merged green, because typescript
      # is invisible to CI by construction — the same property FILE-MAP.md
      # documents as what makes this dependency easy to break silently. Nothing
      # failed until a post was opened in an editor.
      #
      # Lift this when mdx-analyzer's Volar core supports TypeScript 7, and move
      # the pin in package.json onto its new range in the same commit.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
