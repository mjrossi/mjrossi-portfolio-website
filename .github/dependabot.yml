version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Astro majors move in lockstep (astro + its integrations share peer
      # ranges); splitting them across PRs makes every PR fail ERESOLVE.
      astro-major:
        patterns:
          - astro
          - "@astrojs/*"
        update-types:
          - major
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # wrangler 4.111.0 removed the `legacy_env` config field, but
      # @astrojs/cloudflare (through 14.x, the latest) still injects
      # `legacy_env: true` into the generated dist/server/wrangler.json, so
      # newer wrangler hard-errors on `dev`/`deploy`. Hold at 4.110.x until the
      # adapter stops emitting it (likely @astrojs/cloudflare 15).
      - dependency-name: "wrangler"
        versions: [">=4.111.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
