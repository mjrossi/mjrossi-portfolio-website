name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Activates mise.ci.toml's [env] overlay (Turnstile's always-passes test
      # site key) on top of mise.toml's [tools] + [env]. Below, we explicitly
      # export mise's resolved environment to GITHUB_ENV — mise-action@v3
      # installs mise but doesn't auto-propagate [env] to subsequent steps.
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Export mise [env] to GITHUB_ENV
        # `mise env --shell=bash` emits `export KEY="value"` lines; strip the
        # `export ` prefix and surrounding quotes for GITHUB_ENV's KEY=value
        # format. Single source of truth = mise.ci.toml + mise.toml.
        run: mise env --shell=bash | sed -E 's/^export ([^=]+)="?([^"]*)"?$/\1=\2/' >> "$GITHUB_ENV"
      - run: npm ci
      # Unit tests before the build: they are the only proof the preview-token
      # HMAC and the scheduled-publishing predicate are correct. smoke can
      # assert the wiring exists but cannot verify the crypto, so without this
      # step that logic ships ungated.
      - run: npm test
      - run: npm run build
      # Retried ONLY on exit 75, which smoke uses for "wrangler dev died
      # mid-run" and nothing else. That crash is cloudflare/workers-sdk#4562 --
      # the dev ProxyWorker loses its connection to a repeatedly-called Durable
      # Object (local D1 is one), and wrangler treats it as fatal. It has no fix
      # through wrangler 4.119 and no workaround here that keeps the galley's
      # quota and allowlist assertions.
      #
      # A failed assertion exits 1, is not retried, and stays red. Do not
      # broaden this to `|| npm run smoke` -- that would retry real failures and
      # turn a reproducible bug into a flaky one.
      - name: Smoke
        run: |
          set +e
          npm run smoke
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "::warning::wrangler dev crashed mid-run (workers-sdk#4562); retrying smoke once"
            npm run smoke
          else
            exit "$code"
          fi
