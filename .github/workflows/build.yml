name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Activates mise.ci.toml's [env] overlay (Turnstile's always-passes test
      # site key) on top of mise.toml's [tools] + [env]. Below, we explicitly
      # export mise's resolved environment to GITHUB_ENV — mise-action@v3
      # installs mise but doesn't auto-propagate [env] to subsequent steps.
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Export mise [env] to GITHUB_ENV
        # `mise env --shell=bash` emits `export KEY="value"` lines; strip the
        # `export ` prefix and surrounding quotes for GITHUB_ENV's KEY=value
        # format. Single source of truth = mise.ci.toml + mise.toml.
        run: mise env --shell=bash | sed -E 's/^export ([^=]+)="?([^"]*)"?$/\1=\2/' >> "$GITHUB_ENV"
      - run: npm ci
      - name: Diagnose env
        run: |
          echo "=== node version ==="
          node --version
          echo "=== PUBLIC_TURNSTILE_SITE_KEY ==="
          echo "[${PUBLIC_TURNSTILE_SITE_KEY:-NOT_SET}]"
          echo "=== mise files in repo ==="
          ls -la mise* 2>&1 || true
          echo "=== mise environment (shell=bash) ==="
          mise env --shell=bash 2>&1 || echo "(mise not on PATH or mise env failed)"
      - run: npm run build
      - name: Diagnose dist
        if: always()
        run: |
          echo "=== dist tree ==="
          ls -la dist/ 2>&1 || true
          echo "=== dist/client ==="
          ls -la dist/client/ 2>&1 | head -20 || true
          echo "=== dist/server (chunks) ==="
          ls -la dist/server/chunks/ 2>&1 | head -10 || true
      - run: npm run smoke
