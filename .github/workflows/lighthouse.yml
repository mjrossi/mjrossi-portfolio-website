name: Lighthouse

on:
  # Cloudflare Workers Builds reports deploys via check runs. When the CF
  # app's check_suite completes we audit whichever URL got deployed:
  # mjrossi.com for main, or the per-branch preview alias for PR branches.
  check_suite:
    types: [completed]
  # Manual escape hatch for auditing an arbitrary URL (e.g. a PR's
  # Workers preview URL) on demand.
  workflow_dispatch:
    inputs:
      url:
        description: "URL to audit (e.g. a Workers preview URL)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lighthouse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_suite.conclusion == 'success' &&
       contains(github.event.check_suite.app.slug, 'cloudflare'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve target URL
        id: url
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ inputs.url }}
          HEAD_BRANCH: ${{ github.event.check_suite.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            URL="$DISPATCH_URL"
          elif [ "$HEAD_BRANCH" = "main" ]; then
            URL="https://mjrossi.com"
          else
            # Cloudflare Workers per-branch preview alias:
            # <branch-alias>-<worker-name>.<subdomain>.workers.dev
            # Alias = lowercase, non-alphanumerics collapsed to dashes, trimmed.
            ALIAS=$(printf '%s' "$HEAD_BRANCH" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
            URL="https://${ALIAS}-mjrossi-portfolio-website.link00seven.workers.dev"
          fi
          URL="${URL%/}"
          echo "base=$URL" >> "$GITHUB_OUTPUT"
          echo "Auditing base URL: $URL"
      - name: Audit with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.url.outputs.base }}/
            ${{ steps.url.outputs.base }}/work
            ${{ steps.url.outputs.base }}/education
            ${{ steps.url.outputs.base }}/urban-mobility
            ${{ steps.url.outputs.base }}/projects
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Summarize scores
        if: always()
        run: |
          shopt -s nullglob
          reports=(.lighthouseci/lhr-*.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No Lighthouse reports found to summarize."
            exit 0
          fi
          {
            echo "## Lighthouse scores"
            echo ""
            echo "| URL | Perf | A11y | BP | SEO |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            for f in "${reports[@]}"; do
              url=$(jq -r '.finalDisplayedUrl // .finalUrl' "$f")
              perf=$(jq -r '(.categories.performance.score * 100) | floor' "$f")
              a11y=$(jq -r '(.categories.accessibility.score * 100) | floor' "$f")
              bp=$(jq -r '(.categories["best-practices"].score * 100) | floor' "$f")
              seo=$(jq -r '(.categories.seo.score * 100) | floor' "$f")
              echo "| $url | $perf | $a11y | $bp | $seo |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
