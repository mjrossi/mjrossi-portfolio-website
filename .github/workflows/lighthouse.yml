name: Lighthouse

on:
  # Cloudflare Workers Builds posts a commit status (not a Deployment API
  # entry) when a build/deploy finishes. The status payload's target_url is
  # the preview/production URL, which is exactly what we want to audit.
  status:
  # Manual escape hatch for auditing an arbitrary URL on demand.
  workflow_dispatch:
    inputs:
      url:
        description: "URL to audit (e.g. a Workers preview URL)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lighthouse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.state == 'success' &&
       github.event.target_url != '' &&
       contains(github.event.context, 'loudflare'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve target URL
        id: url
        env:
          EVENT_NAME: ${{ github.event_name }}
          STATUS_URL: ${{ github.event.target_url }}
          DISPATCH_URL: ${{ inputs.url }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            URL="$DISPATCH_URL"
          else
            URL="$STATUS_URL"
          fi
          URL="${URL%/}"
          echo "base=$URL" >> "$GITHUB_OUTPUT"
          echo "Auditing base URL: $URL"
      - name: Audit with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.url.outputs.base }}/
            ${{ steps.url.outputs.base }}/work
            ${{ steps.url.outputs.base }}/education
            ${{ steps.url.outputs.base }}/urban-mobility
            ${{ steps.url.outputs.base }}/projects
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
