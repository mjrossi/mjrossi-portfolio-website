name: Lighthouse

on:
  deployment_status:

permissions:
  contents: read

jobs:
  lighthouse:
    # Fires whenever any deployment reports success (Cloudflare Workers Builds
    # creates GitHub Deployments for each PR/push preview). The target_url is
    # the preview URL to audit.
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.target_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize preview URL
        id: url
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: echo "base=${TARGET_URL%/}" >> "$GITHUB_OUTPUT"
      - name: Audit preview with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.url.outputs.base }}/
            ${{ steps.url.outputs.base }}/work
            ${{ steps.url.outputs.base }}/education
            ${{ steps.url.outputs.base }}/urban-mobility
            ${{ steps.url.outputs.base }}/projects
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
