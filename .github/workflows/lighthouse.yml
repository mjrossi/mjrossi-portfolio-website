name: Lighthouse
run-name: "Lighthouse · mjrossi.com"

# Audits PRODUCTION ONLY, after Cloudflare has finished deploying main.
#
# Auditing PR preview deploys instead is the obvious-looking design and was
# tried; it is not worth what it costs. Preview hosts sit behind Cloudflare
# Access, so the audit needs a service token — which Lighthouse then copies
# verbatim into `configSettings` in every report JSON and inlines into every
# HTML report. On a public repo that means the workflow also has to own a
# redaction pass, gate both of the action's upload paths, refuse fork PRs
# (whose Worker could read the token straight off the request), and anchor a
# host allowlist so a free-text `workflow_dispatch` URL can't be handed the
# credentials. That was ~350 lines of security-critical shell guarding a
# preview audit that had never once produced a valid score.
#
# Production needs none of it: mjrossi.com is public, so there is no token,
# nothing to redact, and nothing to leak. The trade is that a regression is
# caught just after it ships rather than just before. On a static site with
# instant deploys and revert-as-rollback, that is the cheaper failure.

on:
  # Cloudflare Workers Builds reports deploys via check runs. When the CF app's
  # check_suite completes successfully on main, the new code is live.
  check_suite:
    types: [completed]
  # Manual re-run, e.g. after a Cloudflare-side change. Takes no input: the
  # target is always production. A free-text URL input is what previously
  # forced scheme/port validation and a credential host allowlist.
  workflow_dispatch:

permissions:
  contents: read

# numberOfRuns is 3, so an audit is several minutes of Lighthouse. Rapid merges
# would otherwise leave two jobs auditing the same origin at once, each adding
# load that degrades the other's numbers.
concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    # `head_branch == 'main'` is what keeps this to production. Cloudflare's
    # check suite also completes for every PR branch deploy; those are ignored.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_suite.conclusion == 'success' &&
       github.event.check_suite.head_branch == 'main' &&
       contains(github.event.check_suite.app.slug, 'cloudflare'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep this list in sync with docs/ARCHITECTURE.md. /projects is excluded
      # because it is noindex and would fail SEO by design. The blog pair covers
      # the newsletter form's Turnstile script and the BlogPost layout.
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://mjrossi.com/
            https://mjrossi.com/work
            https://mjrossi.com/education
            https://mjrossi.com/urban-mobility
            https://mjrossi.com/blog
            https://mjrossi.com/blog/why-im-pivoting
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
