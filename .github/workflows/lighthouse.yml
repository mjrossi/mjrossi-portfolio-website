name: Lighthouse
run-name: "Lighthouse · ${{ github.event.check_suite.head_branch || inputs.url || github.ref_name }}"

on:
  # Cloudflare Workers Builds reports deploys via check runs. When the CF
  # app's check_suite completes we audit whichever URL got deployed:
  # mjrossi.com for main, or the per-branch preview alias for PR branches.
  check_suite:
    types: [completed]
  # Manual escape hatch for auditing an arbitrary URL (e.g. a PR's
  # Workers preview URL) on demand.
  workflow_dispatch:
    inputs:
      url:
        description: "URL to audit (e.g. a Workers preview URL)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lighthouse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_suite.conclusion == 'success' &&
       contains(github.event.check_suite.app.slug, 'cloudflare'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve target URL and PR context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ inputs.url }}
          HEAD_BRANCH: ${{ github.event.check_suite.head_branch }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            URL="$DISPATCH_URL"
            BRANCH="${GITHUB_REF_NAME}"
            SHA="${GITHUB_SHA}"
          else
            SHA="$HEAD_SHA"
            BRANCH="$HEAD_BRANCH"
            if [ "$HEAD_BRANCH" = "main" ]; then
              URL="https://mjrossi.com"
            else
              # Read the preview hostname out of Cloudflare's own check run
              # rather than deriving it. Cloudflare does NOT simply slugify the
              # branch — it truncates the alias to 32 chars plus a 4-char hash
              # (`dependabot-npm-and-yarn-npm-mino-ad6f-…`). Reconstructing it
              # by hand produced a >63-character DNS label for long dependabot
              # branches, which is an illegal hostname: Chrome could not
              # resolve it and `lhci collect` aborted with
              # CHROME_INTERSTITIAL_ERROR before writing a single report.
              SUMMARY=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
                --jq '.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages") | .output.summary')
              URL=$(printf '%s' "$SUMMARY" | grep -oE 'Preview Alias URL: \S+' | head -1 | cut -d' ' -f4)
              # Version-scoped URL is the fallback; it is always short and
              # points at exactly the deployment this check suite reported.
              [ -n "$URL" ] || URL=$(printf '%s' "$SUMMARY" | grep -oE 'Preview URL: \S+' | head -1 | cut -d' ' -f3)
              if [ -z "$URL" ]; then
                echo "::error::No preview URL in the Cloudflare check run for ${SHA}. Expected a 'Preview Alias URL:' or 'Preview URL:' line in its summary; check that preview_urls is still true in wrangler.jsonc."
                exit 1
              fi
            fi
          fi
          URL="${URL%/}"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          # main enforces all four categories strictly. PR previews relax
          # SEO (CF preview URLs ship `x-robots-tag: noindex`) and perf
          # (simulate throttling on shared CI runners produces high TBT
          # variance — real regressions still show up in the posted
          # scores, just without blocking the check).
          if [ "$BRANCH" = "main" ]; then
            CONFIG=".github/lighthouserc.main.json"
          else
            CONFIG=".github/lighthouserc.json"
          fi
          echo "base=$URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "is_main=$([ "$BRANCH" = "main" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Auditing $BRANCH → $URL (PR #${PR_NUMBER:-none}, sha ${SHA:0:7}, config $CONFIG)"

      # Preview deploys sit behind Cloudflare Access. Without credentials every
      # request 302s to link00seven.cloudflareaccess.com and Lighthouse happily
      # audits the LOGIN PAGE — scoring a flat A11y 77 / BP 93 / SEO 54 on all
      # six URLs, which can never satisfy the minScore:1 assertions. The
      # service token is injected as request headers rather than baked into the
      # committed config; see "Credential containment" below for why the upload
      # settings change alongside it.
      - name: Prepare LHCI config
        id: lhci
        env:
          CONFIG: ${{ steps.ctx.outputs.config }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          IS_MAIN: ${{ steps.ctx.outputs.is_main }}
        run: |
          # mjrossi.com is not behind Access, so main needs no credentials.
          if [ "$IS_MAIN" != "true" ] && [ -n "$CF_ACCESS_CLIENT_ID" ]; then
            jq --arg id "$CF_ACCESS_CLIENT_ID" --arg secret "$CF_ACCESS_CLIENT_SECRET" \
              '.ci.collect.settings.extraHeaders = {"CF-Access-Client-Id": $id, "CF-Access-Client-Secret": $secret}' \
              "$CONFIG" > lighthouserc.runtime.json
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
            echo "Injected Cloudflare Access service-token headers."
          else
            cp "$CONFIG" lighthouserc.runtime.json
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            if [ "$IS_MAIN" != "true" ]; then
              echo "::warning::CF_ACCESS_CLIENT_ID is unset — the preview audit will be blocked by Cloudflare Access."
            fi
          fi

      # Both failures this guard catches used to be silent: one audited a
      # Cloudflare Access login screen, the other an unresolvable hostname.
      # Fail here, naming the cause, instead of 90s later as bogus findings.
      - name: Preflight target
        env:
          BASE_URL: ${{ steps.ctx.outputs.base }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HAS_CREDENTIALS: ${{ steps.lhci.outputs.has_credentials }}
        run: |
          if [ "$HAS_CREDENTIALS" = "true" ]; then
            set -- -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
                   -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
          else
            set --
          fi
          if ! OUT=$(curl -sSL --max-time 30 -o /dev/null \
              -w '%{http_code} %{url_effective}' "$@" "${BASE_URL}/"); then
            echo "::error::Could not reach ${BASE_URL}/ — the hostname may not resolve."
            exit 1
          fi
          CODE="${OUT%% *}"
          FINAL="${OUT#* }"
          case "$FINAL" in
            "$BASE_URL"/*|"$BASE_URL") ;;
            *)
              # Report the origin only — an Access redirect carries a multi-KB
              # JWT in the query string and would bury the message.
              echo "::error::${BASE_URL}/ redirected off-origin to $(printf '%s' "$FINAL" | cut -d/ -f1-3) — Cloudflare Access is blocking the audit. Check the CF_ACCESS_* secrets and that the Access app has a Service Auth policy for this token."
              exit 1
              ;;
          esac
          if [ "$CODE" != "200" ]; then
            echo "::error::${BASE_URL}/ returned HTTP ${CODE}, expected 200."
            exit 1
          fi
          echo "Preflight OK — ${FINAL} returned ${CODE}."

      - name: Audit with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.ctx.outputs.base }}/
            ${{ steps.ctx.outputs.base }}/work
            ${{ steps.ctx.outputs.base }}/education
            ${{ steps.ctx.outputs.base }}/urban-mobility
            ${{ steps.ctx.outputs.base }}/blog
            ${{ steps.ctx.outputs.base }}/blog/why-im-pivoting
          configPath: ./lighthouserc.runtime.json
          # Credential containment. Lighthouse records `settings.extraHeaders`
          # verbatim into `configSettings` in every lhr-*.json, and the
          # lhr-*.html reports embed that same JSON. This repo is PUBLIC, so
          # both of this action's upload paths would publish the Access service
          # token: temporaryPublicStorage writes to a world-readable GCS URL
          # that is printed in the logs, and artifacts on a public repo are
          # downloadable by anyone. When credentials are in play we therefore
          # let the action upload nothing and hand off to the redact + upload
          # steps below. main injects no headers and keeps both, unchanged.
          uploadArtifacts: ${{ steps.lhci.outputs.has_credentials != 'true' }}
          temporaryPublicStorage: ${{ steps.lhci.outputs.has_credentials != 'true' }}

      - name: Redact credentials from reports
        if: always() && steps.lhci.outputs.has_credentials == 'true'
        run: |
          shopt -s nullglob
          # Only the lhr-*.json reports carry configSettings. assertion-results
          # .json is a top-level array and is deliberately left alone — running
          # `has(...)` against it is a type error, not a no-op.
          for f in .lighthouseci/lhr-*.json; do
            tmp=$(mktemp)
            jq 'if type == "object" and has("configSettings")
                then .configSettings.extraHeaders = null else . end' "$f" > "$tmp"
            mv "$tmp" "$f"
          done
          # The HTML reports embed the unredacted LHR as inline JSON; the
          # summary step below only reads the JSON, so drop them entirely
          # rather than trying to rewrite markup.
          rm -f .lighthouseci/*.html
          # Fail closed. This step is the only thing standing between a
          # service token and a public artifact, so verify rather than assume:
          # if the header name survived anywhere, abort before the upload step.
          if grep -rIl 'CF-Access-Client' .lighthouseci/ 2>/dev/null | grep -q .; then
            echo "::error::Redaction failed — Access credentials are still present in .lighthouseci. Refusing to upload."
            exit 1
          fi

      - name: Upload redacted reports
        if: always() && steps.lhci.outputs.has_credentials == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci
          if-no-files-found: ignore
      - name: Build summary + averages
        if: always()
        id: scores
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
          BASE_URL: ${{ steps.ctx.outputs.base }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          shopt -s nullglob
          reports=(.lighthouseci/lhr-*.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "status=no-reports" >> "$GITHUB_OUTPUT"
            {
              echo "## Lighthouse · \`$BRANCH\`"
              echo ""
              echo "Audited: <$BASE_URL>"
              echo ""
              echo "No Lighthouse reports were produced — the run failed before collect. Check the preflight step: the target may be unreachable or blocked by Cloudflare Access."
            } | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/lh-body.md
            exit 0
          fi

          {
            echo "## Lighthouse · \`$BRANCH\`"
            echo ""
            echo "Audited: <$BASE_URL> (commit \`${SHA:0:7}\`)"
            echo ""
            echo "| URL | Perf | A11y | BP | SEO |"
            echo "| --- | ---: | ---: | ---: | ---: |"
          } > /tmp/lh-body.md

          # numberOfRuns is 3, so there are three reports per URL. Collapse each
          # URL to its median-by-performance run — the same "one representative
          # run" LHCI asserts against — otherwise the table would list every URL
          # three times and the averages would be dominated by whichever page
          # happened to produce extra runs.
          jq -s '
            map({
              url:  (.finalDisplayedUrl // .finalUrl),
              perf: (.categories.performance.score * 100 | floor),
              a11y: (.categories.accessibility.score * 100 | floor),
              bp:   (.categories["best-practices"].score * 100 | floor),
              seo:  (.categories.seo.score * 100 | floor)
            })
            | group_by(.url)
            | map(sort_by(.perf) | .[length / 2 | floor])
          ' "${reports[@]}" > /tmp/lh-median.json

          jq -r '.[] | "| \(.url) | \(.perf) | \(.a11y) | \(.bp) | \(.seo) |"' \
            /tmp/lh-median.json >> /tmp/lh-body.md

          read -r avg_perf avg_a11y avg_bp avg_seo < <(jq -r '
            [.[] | .perf], [.[] | .a11y], [.[] | .bp], [.[] | .seo]
            | (add / length | floor) | tostring
          ' /tmp/lh-median.json | paste -sd' ' -)

          {
            echo ""
            echo "**Averages** · Perf $avg_perf · A11y $avg_a11y · BP $avg_bp · SEO $avg_seo"
          } >> /tmp/lh-body.md

          cat /tmp/lh-body.md >> "$GITHUB_STEP_SUMMARY"

          echo "avg_perf=$avg_perf" >> "$GITHUB_OUTPUT"
          echo "avg_a11y=$avg_a11y" >> "$GITHUB_OUTPUT"
          echo "avg_bp=$avg_bp" >> "$GITHUB_OUTPUT"
          echo "avg_seo=$avg_seo" >> "$GITHUB_OUTPUT"
          echo "status=ok" >> "$GITHUB_OUTPUT"
      - name: Post sticky PR comment
        if: always() && steps.ctx.outputs.pr != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.ctx.outputs.pr }}
          header: lighthouse
          path: /tmp/lh-body.md
      - name: Publish check run with averages
        if: always() && steps.scores.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.ctx.outputs.sha }}
          AVG_PERF: ${{ steps.scores.outputs.avg_perf }}
          AVG_A11Y: ${{ steps.scores.outputs.avg_a11y }}
          AVG_BP: ${{ steps.scores.outputs.avg_bp }}
          AVG_SEO: ${{ steps.scores.outputs.avg_seo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Perf ${AVG_PERF} · A11y ${AVG_A11Y} · BP ${AVG_BP} · SEO ${AVG_SEO}"
          SUMMARY=$(cat /tmp/lh-body.md)
          jq -n \
            --arg name "Lighthouse scores" \
            --arg head_sha "$SHA" \
            --arg status "completed" \
            --arg conclusion "neutral" \
            --arg details_url "$RUN_URL" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name: $name, head_sha: $head_sha, status: $status, conclusion: $conclusion, details_url: $details_url, output: {title: $title, summary: $summary}}' \
            | gh api "repos/${REPO}/check-runs" --method POST --input -
