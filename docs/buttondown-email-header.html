<!--
  Buttondown email HEADER — paste into Buttondown → Settings → Email design → Header.
  ──────────────────────────────────────────────────────────────────────────────────

  Pairs with:
    docs/buttondown-email-footer.html
    docs/buttondown-email-custom.css
  in this same directory. Source of truth lives here; Buttondown's dashboard is the
  copy that actually serves emails. Drift between the two is the operator's
  responsibility — edit the file first, re-paste the affected section.

  Buttondown wraps this fragment in its own <html>/<head>/<body>; the custom CSS
  (see buttondown-email-custom.css) is injected at <head> level and inlined per
  element at send time, so the class hooks below get their styling from there.

  ─── Template variables ───
  {{ email.publish_date }}  — the email's send date (renders as the edition line)
  If Buttondown's UI flags a variable as unknown, check current docs and adjust.

  ─── Design intent ───
  Mirror the site's masthead at mjrossi.com:
    • "MJ" in dark text + "ROSSI" in the warm-amber accent (Fraunces / Georgia fallback)
    • Right-aligned location + edition meta (Inter / system-sans fallback)
    • Italic tagline flanked by hairline rules
    • Double-rule separator below
-->

<table role="presentation" class="masthead" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td class="masthead-name-cell">
            <a href="https://mjrossi.com" class="masthead-link"
              ><span class="masthead-name">MJ</span><span class="masthead-name masthead-surname">ROSSI</span></a>
          </td>
          <td align="right" class="masthead-meta-cell">
            <span class="masthead-loc">Brooklyn → Lisbon</span>
            <span class="masthead-edition">{{ email.publish_date | date: "%B %Y" }}</span>
          </td>
        </tr>
      </table>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="masthead-tagline-row">
        <tr>
          <td class="masthead-rule">&nbsp;</td>
          <td class="masthead-tagline">Notes from a career in transit</td>
          <td class="masthead-rule">&nbsp;</td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="rule-top">&nbsp;</td></tr>
  <tr><td class="rule-gap">&nbsp;</td></tr>
  <tr><td class="rule-bot">&nbsp;</td></tr>
</table>
