# Local development environment for mise.
#
# Activated when MISE_ENV=development (configure once in your shell: e.g.
# `MISE_ENV=development` in ~/.zshrc or ~/.bashrc). Overrides mise.toml's
# real production Turnstile site key with the documented always-passes
# test key, so the form on /blog renders and validates locally without
# adding localhost / *.workers.dev to your real Turnstile site config.
#
# Pairs with the matching test SECRET key in `.dev.vars` — see
# .dev.vars.example. The two test keys work together: the test site key
# (here, baked into HTML at build time) issues tokens that the test secret
# key (in .dev.vars, used by /api/subscribe at runtime) always accepts.
#
# Committed by design: the test keys are publicly documented and have no
# security value. `mise.local.toml` (gitignored) is still available if you
# need machine-specific overrides on top of this.
#
# NOTE: there is deliberately no `[tools] wrangler` here, and it should not
# come back. mise's Node cookbook does endorse pinning npm CLIs as mise
# tools, but that applies to tools the build merely *runs* (tsc, eslint).
# wrangler is a peerDependency of @astrojs/cloudflare and is imported as a
# library by @cloudflare/vite-plugin during `astro build`, so it has to be
# resolvable from node_modules regardless — a mise pin could only ever be a
# duplicate of the package.json one, never a replacement for it. This file
# held 4.90.1 while package.json held 4.115.0; the older workerd then could
# not open the `.wrangler/state` the newer one had written, and
# `just galley-migrate --local` died before it reached the migration.
# mise.toml puts ./node_modules/.bin on PATH instead, so a bare `wrangler`
# in the shell is the pinned one.

[env]
# Turnstile's documented always-passes test site key.
# https://developers.cloudflare.com/turnstile/troubleshooting/testing/
PUBLIC_TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
