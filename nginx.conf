server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Private";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/html;
}
