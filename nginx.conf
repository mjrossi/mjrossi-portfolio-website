server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Private";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /health {
        auth_basic off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/html application/xml image/svg+xml;
}
